<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShumShufer — Full Product Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#1A6A38;
  --primary-active:#154f2a;
  --primary-soft:#dbfee1;
  --secondary:#0EA5E9;
  --secondary-soft:#E0F2FE;
  --success:#16A34A;
  --success-soft:#DCFCE7;
  --warning:#F59E0B;
  --warning-soft:#FEF3C7;
  --danger:#DC2626;
  --danger-soft:#FEE2E2;
  --ink:#0F172A;
  --body:#475569;
  --mute:#64748B;
  --canvas:#F8FAFC;
  --card:#FFFFFF;
  --border:#E2E8F0;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --font-sans:"Inter", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing:border-box; }
html,body{margin:0;padding:0;min-width:0;}
body{font-family:var(--font-sans);background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;}
h1,h2,h3,h4,h5{margin:0;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}

/* ---------- Prototype chrome (not part of product UI) ---------- */
#topstrip{
  position:fixed;top:0;left:0;right:0;height:46px;z-index:999;
  background:var(--ink);color:#fff;display:flex;align-items:center;
  padding:0 14px;gap:12px;font-size:12.5px;
}
#topstrip .ts-brand{font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;}
#topstrip .ts-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;}
#topstrip .ts-crumb{color:#94A3B8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topstrip .ts-crumb b{color:#fff;font-weight:600;}
#topstrip .ts-btn{
  background:#1E293B;border:1px solid #334155;color:#fff;border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
#topstrip .ts-btn:hover{background:#334155;}
#topstrip .ts-btn.accent{background:var(--primary);border-color:var(--primary);}
#topstrip .ts-btn.accent:hover{background:var(--primary-active);}

#app{margin-top:46px;min-height:calc(100vh - 46px);}

#drawer{
  position:fixed;top:46px;right:-380px;bottom:0;width:360px;background:#fff;
  border-left:1px solid var(--border);z-index:998;transition:right .25s ease;
  display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(15,23,42,.12);
}
#drawer.open{right:0;}
#drawer .dr-head{padding:16px;border-bottom:1px solid var(--border);}
#drawer .dr-head input{
  width:100%;height:40px;border:1px solid var(--border);border-radius:10px;
  padding:0 12px;font:400 13.5px var(--font-sans);
}
#drawer .dr-count{font-size:11.5px;color:var(--mute);margin-top:8px;}
#drawer .dr-list{flex:1;overflow-y:auto;padding:6px 10px 24px;}
#drawer .dr-group{margin-top:14px;}
#drawer .dr-group-title{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  color:var(--primary);padding:6px 8px;
}
#drawer .dr-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font-size:13px;color:var(--body);cursor:pointer;
}
#drawer .dr-item:hover{background:var(--canvas);color:var(--ink);}
#drawer .dr-item.active{background:var(--primary-soft);color:var(--primary-active);font-weight:700;}
#drawer .dr-item .n{
  width:20px;height:20px;border-radius:50%;background:var(--border);color:var(--mute);
  font-size:10px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;
}
#drawer .dr-item.active .n{background:var(--primary);color:#fff;}
#backdrop{position:fixed;inset:0;top:46px;background:rgba(15,23,42,.35);z-index:997;display:none;}
#backdrop.open{display:block;}

/* ================= Shared product components ================= */

/* Public marketing nav (site header used by public + auth screens) */
.p-nav{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);min-height:64px;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.p-nav-left{display:flex;align-items:center;gap:10px;cursor:pointer;}
.p-logo{width:36px;height:36px;border-radius:9px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.p-brand{font-weight:800;font-size:17px;letter-spacing:-.4px;line-height:1.1;}
.p-brand-sub{font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.p-nav-links{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap;}
.p-nav-links a{padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--body);}
.p-nav-links a:hover{background:var(--primary-soft);color:var(--primary);}
.p-nav-actions{display:flex;gap:8px;align-items:center;flex:none;}

.btn-primary,.btn-secondary,.btn-tertiary,.btn-danger,.btn-ghost{
  height:44px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;text-decoration:none;font-size:14px;font-weight:600;
  cursor:pointer;border:1px solid transparent;white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-active);}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--border);}
.btn-secondary:hover{background:var(--canvas);}
.btn-tertiary{background:#fff;color:var(--primary);border-color:var(--primary);}
.btn-tertiary:hover{background:var(--primary-soft);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-ghost{background:transparent;color:var(--body);border-color:transparent;}
.btn-ghost:hover{background:var(--canvas);}
.btn-sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;}
.btn-primary[disabled],.btn-secondary[disabled]{opacity:.5;cursor:not-allowed;}

.container{max-width:1180px;margin:0 auto;padding:0 32px;}
.pub-section{padding:56px 32px;max-width:1180px;margin:0 auto;}
.pub-footer{background:var(--ink);color:#CBD5E1;padding:48px 32px 28px;margin-top:0;}
.pub-footer .fcols{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;}
.pub-footer h5{color:#fff;font-size:13px;margin-bottom:14px;}
.pub-footer a{display:block;color:#94A3B8;font-size:13px;padding:5px 0;}
.pub-footer .fbottom{max-width:1180px;margin:28px auto 0;border-top:1px solid #1E293B;padding-top:20px;font-size:12px;color:#64748B;}

/* Auth centered card layout */
.auth-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;
  padding:48px 20px;background:linear-gradient(135deg,#F0FDF4 0%,#F8FAFC 60%,#E0F2FE 100%);}
.auth-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:20px;
  padding:36px 32px;box-shadow:0 18px 44px rgba(15,23,42,.08);}
.auth-eyebrow{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.auth-card h1{font-size:24px;letter-spacing:-.6px;margin-bottom:6px;}
.auth-card .sub{font-size:13.5px;color:var(--body);margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;height:46px;padding:0 14px;border:1px solid var(--border);border-radius:11px;
  font:400 14.5px var(--font-sans);color:var(--ink);background:#fff;
}
.field textarea{height:auto;padding:12px 14px;min-height:88px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--primary-soft);border-color:var(--primary);}
.field .hint{font-size:11.5px;color:var(--mute);margin-top:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.divider-text{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--mute);font-size:12px;}
.divider-text::before,.divider-text::after{content:"";flex:1;height:1px;background:var(--border);}
.social-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.auth-foot{text-align:center;margin-top:20px;font-size:13px;color:var(--body);}
.auth-foot a{color:var(--primary);font-weight:700;}

/* App shell (logged-in roles) */
.shell{display:flex;min-height:calc(100vh - 46px);}
.side{
  width:246px;flex:none;background:#fff;border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:46px;height:calc(100vh - 46px);
}
.side-brand{display:flex;align-items:center;gap:9px;padding:18px 18px 4px;font-weight:800;font-size:16px;letter-spacing:-.3px;}
.side-brand .p-logo{width:30px;height:30px;font-size:15px;border-radius:8px;}
.side-role{
  margin:8px 16px 10px;padding:5px 10px;background:var(--primary-soft);color:var(--primary-active);
  border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;width:fit-content;
}
.side-nav{flex:1;overflow-y:auto;padding:6px 10px;}
.side-group-title{font-size:10.5px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;padding:14px 10px 6px;}
.side-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;
  font-weight:600;color:var(--body);margin-bottom:2px;
}
.side-link .ic{width:18px;text-align:center;flex:none;font-size:14.5px;}
.side-link:hover{background:var(--canvas);color:var(--ink);}
.side-link.active{background:var(--primary-soft);color:var(--primary-active);}
.side-foot{border-top:1px solid var(--border);padding:10px;}
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;gap:16px;position:sticky;top:46px;z-index:10;
}
.topbar-search{
  flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--canvas);
  border:1px solid var(--border);border-radius:10px;height:40px;padding:0 12px;color:var(--mute);font-size:13px;
}
.topbar-search input{border:0;background:transparent;outline:0;flex:1;font:400 13.5px var(--font-sans);color:var(--ink);}
.topbar-actions{display:flex;align-items:center;gap:14px;}
.icon-btn{
  position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;
  font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none;}
.avatar.sky{background:var(--secondary);}
.avatar.lg{width:56px;height:56px;font-size:18px;}
.shell-content{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;}
.shell-content.wide{max-width:1320px;}

.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head .crumb{font-size:12px;color:var(--mute);font-weight:600;margin-bottom:6px;}
.page-head h1{font-size:24px;letter-spacing:-.5px;}
.page-head .desc{font-size:13.5px;color:var(--body);margin-top:6px;max-width:560px;}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* Cards / grids */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;}
.card.pad-sm{padding:14px 16px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 20px;}
.stat-card .lbl{font-size:12px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;}
.stat-card .val{font-size:26px;font-weight:800;letter-spacing:-.6px;}
.stat-card .delta{font-size:12px;font-weight:700;margin-top:6px;}
.stat-card .delta.up{color:var(--success);}
.stat-card .delta.down{color:var(--danger);}
.section-title{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.section-title .link{font-size:12.5px;font-weight:700;color:var(--primary);}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge.green{background:var(--primary-soft);color:#166534;}
.badge.blue{background:var(--secondary-soft);color:#075985;}
.badge.success{background:var(--success-soft);color:#166534;}
.badge.warning{background:var(--warning-soft);color:#92400E;}
.badge.danger{background:var(--danger-soft);color:#991B1B;}
.badge.grey{background:#F1F5F9;color:var(--mute);}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;}
table.dtable{width:100%;border-collapse:collapse;background:#fff;min-width:560px;}
table.dtable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mute);
  background:#F8FAFC;padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700;}
table.dtable td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px;}
table.dtable tr:last-child td{border-bottom:0;}
table.dtable tr:hover td{background:#FAFBFC;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
.tab.active{color:var(--primary);border-color:var(--primary);}

/* Progress */
.progress{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;}
.progress > span{display:block;height:100%;background:var(--primary);border-radius:99px;}
.progress.sky > span{background:var(--secondary);}
.progress.warn > span{background:var(--warning);}

/* Stepper */
.stepper{display:flex;align-items:flex-start;gap:0;margin-bottom:8px;}
.step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;text-align:center;}
.step .circ{width:32px;height:32px;border-radius:50%;background:#E2E8F0;color:var(--mute);font-weight:800;
  font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;z-index:1;}
.step.done .circ{background:var(--primary);color:#fff;}
.step.current .circ{background:#fff;border:2px solid var(--primary);color:var(--primary);}
.step .lbl{font-size:12px;font-weight:700;color:var(--body);}
.step .sub{font-size:10.5px;color:var(--mute);}
.step::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:2px;background:#E2E8F0;z-index:0;}
.step:first-child::before{display:none;}
.step.done::before{background:var(--primary);}

/* Lists */
.list-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:0;}
.list-item .ico{width:38px;height:38px;border-radius:10px;background:var(--canvas);display:flex;align-items:center;
  justify-content:center;font-size:17px;flex:none;}
.list-item .body-txt{flex:1;min-width:0;}
.list-item .ttl{font-size:13.5px;font-weight:700;}
.list-item .meta{font-size:12px;color:var(--mute);margin-top:2px;}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--mute);}
.empty .ic{font-size:36px;margin-bottom:10px;}
.empty h4{font-size:14.5px;color:var(--ink);margin-bottom:4px;}
.empty p{font-size:13px;max-width:320px;margin:0 auto;}

/* Misc */
.hairline{border:0;border-top:1px solid var(--border);margin:18px 0;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;
  font-size:12.5px;font-weight:700;color:var(--body);background:#fff;cursor:pointer;}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.search-inline{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;
  height:48px;padding:0 16px;color:var(--mute);}
.search-inline input{border:0;outline:0;flex:1;font:400 14.5px var(--font-sans);color:var(--ink);background:transparent;}
.star{color:var(--warning);}
.map-placeholder{
  background:repeating-linear-gradient(45deg,#EAF2ED,#EAF2ED 12px,#F3F8F4 12px,#F3F8F4 24px);
  border:1px solid var(--border);border-radius:16px;min-height:260px;display:flex;align-items:center;
  justify-content:center;color:var(--mute);font-size:13px;font-weight:700;position:relative;overflow:hidden;
}
.map-pin{position:absolute;width:30px;height:30px;background:var(--primary);border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2);}
.video-box{
  background:var(--ink);border-radius:16px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  color:#fff;position:relative;
}
.video-box .play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.15);
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;}
.dropzone{border:2px dashed var(--border);border-radius:14px;padding:32px 20px;text-align:center;color:var(--mute);font-size:13px;background:#FAFBFC;}
.dropzone .ic{font-size:26px;margin-bottom:8px;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{border:1px solid var(--border);border-radius:10px;min-height:78px;padding:6px;font-size:11px;color:var(--mute);background:#fff;}
.cal-cell .d{font-weight:800;color:var(--ink);font-size:12px;}
.cal-cell .ev{margin-top:4px;padding:2px 5px;border-radius:5px;font-size:9.5px;font-weight:700;}
.cal-cell .ev.green{background:var(--primary-soft);color:#166534;}
.cal-cell .ev.blue{background:var(--secondary-soft);color:#075985;}
.cal-cell.today{border-color:var(--primary);background:var(--primary-soft);}
.quiz-q{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.quiz-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-top:8px;font-size:13.5px;}
.quiz-opt.correct{border-color:var(--success);background:var(--success-soft);}
.radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex:none;}
.toggle{width:38px;height:22px;border-radius:99px;background:var(--border);position:relative;flex:none;}
.toggle.on{background:var(--primary);}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;}
.toggle.on::after{left:18px;}

@media (max-width:900px){
  .side{display:none;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .pub-footer .fcols{grid-template-columns:1fr 1fr;}
  #drawer{width:88%;right:-100%;}
  .p-nav-links{display:none;}
}
</style>
</head>
<body>

<div id="topstrip">
  <div class="ts-brand"><span class="dot"></span>ShumShufer Prototype</div>
  <div class="ts-crumb" id="tsCrumb">Loading…</div>
  <button class="ts-btn" id="prevBtn">← Prev</button>
  <button class="ts-btn" id="nextBtn">Next →</button>
  <button class="ts-btn accent" id="drawerToggle">☰ All Screens</button>
</div>

<div id="app"></div>
<div id="backdrop"></div>
<div id="drawer">
  <div class="dr-head">
    <input type="text" id="drSearch" placeholder="Search 60 screens…">
    <div class="dr-count" id="drCount"></div>
  </div>
  <div class="dr-list" id="drList"></div>
</div>

<!--TEMPLATES_START-->

<!--SCRIPT_START-->
<script>
(function(){
  var CATEGORY_ORDER = ["Public","Auth","Student","Mentor","Education Head","Shared"];
  var templates = Array.prototype.slice.call(document.querySelectorAll('template[id^="page-"]'));
  var pages = templates.map(function(t){
    return { id: t.id.replace(/^page-/,''), cat: t.getAttribute('data-cat')||'Other', title: t.getAttribute('data-title')||t.id, el: t };
  });
  // stable order: by category order, then by numeric prefix in title if present, else insertion order
  function numPrefix(title){ var m = title.match(/^(\d+)\./); return m? parseInt(m[1],10) : 999; }
  pages.sort(function(a,b){
    var ca = CATEGORY_ORDER.indexOf(a.cat), cb = CATEGORY_ORDER.indexOf(b.cat);
    if(ca!==cb) return ca-cb;
    return numPrefix(a.title)-numPrefix(b.title);
  });
  var byId = {}; pages.forEach(function(p){ byId[p.id]=p; });

  var appEl = document.getElementById('app');
  var crumbEl = document.getElementById('tsCrumb');
  var drList = document.getElementById('drList');
  var drCount = document.getElementById('drCount');
  var drSearch = document.getElementById('drSearch');
  var drawer = document.getElementById('drawer');
  var backdrop = document.getElementById('backdrop');
  var currentId = null;

  function buildDrawer(filter){
    filter = (filter||'').toLowerCase();
    drList.innerHTML = '';
    var shown = 0;
    CATEGORY_ORDER.forEach(function(cat){
      var items = pages.filter(function(p){ return p.cat===cat && (p.title.toLowerCase().indexOf(filter)>-1); });
      if(!items.length) return;
      var g = document.createElement('div'); g.className='dr-group';
      var gt = document.createElement('div'); gt.className='dr-group-title'; gt.textContent = cat + ' (' + items.length + ')';
      g.appendChild(gt);
      items.forEach(function(p,i){
        shown++;
        var it = document.createElement('div');
        it.className = 'dr-item' + (p.id===currentId? ' active':'');
        it.innerHTML = '<span class="n">'+(i+1)+'</span><span>'+p.title.replace(/^\d+\.\s*/,'')+'</span>';
        it.addEventListener('click', function(){ showScreen(p.id); closeDrawer(); });
        g.appendChild(it);
      });
      drList.appendChild(g);
    });
    drCount.textContent = shown + ' of ' + pages.length + ' screens';
  }

  function openDrawer(){ drawer.classList.add('open'); backdrop.classList.add('open'); buildDrawer(drSearch.value); }
  function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('drawerToggle').addEventListener('click', function(){ drawer.classList.contains('open')? closeDrawer(): openDrawer(); });
  backdrop.addEventListener('click', closeDrawer);
  drSearch.addEventListener('input', function(){ buildDrawer(drSearch.value); });

  function showScreen(id){
    var p = byId[id];
    if(!p){ id='landing'; p = byId[id]; }
    currentId = id;
    appEl.innerHTML = '';
    appEl.appendChild(p.el.content.cloneNode(true));
    crumbEl.innerHTML = '<b>'+p.cat+'</b> &nbsp;/&nbsp; ' + p.title;
    window.scrollTo(0,0);
    if(drawer.classList.contains('open')) buildDrawer(drSearch.value);
  }

  // delegate [data-nav] clicks anywhere inside #app
  appEl.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-nav]') : null;
    if(t){ e.preventDefault(); showScreen(t.getAttribute('data-nav')); }
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    var idx = pages.findIndex(function(p){ return p.id===currentId; });
    var next = pages[(idx-1+pages.length)%pages.length];
    showScreen(next.id);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    var idx = pages.findIndex(function(p){ return p.id===currentId; });
    var next = pages[(idx+1)%pages.length];
    showScreen(next.id);
  });

  showScreen('landing');
})();
</script>
<!--SCRIPT_END-->
